[package]
name = "daily-wallpaper"
version = "0.2.0"
edition = "2021"
description = "A small cross-platform desktop wallpaper setter"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
# Direct user32 calls instead of spawning PowerShell for every wallpaper change.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
